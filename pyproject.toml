[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melete"
version = "0.1.0"
# Describes what melete does, not how it engraves. The renderer is an
# implementation detail that does not belong in the one-line definition or in
# the keywords, both of which PyPI and `pip show` display.
description = "Practice exercise generator. Parameterized bass exercises engraved as standard notation and tablature."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Phillip Moore" }]
keywords = ["music", "practice", "bass", "guitar", "tablature", "notation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio",
]

# No runtime Python dependencies (spec section 15, decision 5).
#
# Rendering is a *toolchain on PATH*, not a Python package: the vendored
# `melete-render/` Node tool (which drives alphaTab) turns emitted alphaTex into
# a Guitar Pro `.gp`. alphatab/render.py is the only module that knows that tool
# exists, and section 13 requires it to fail with an explicit resolution when it
# is missing. Obtaining the toolchain is therefore an environment concern.
dependencies = []

[project.scripts]
# Added by task B15a, with melete/cli.py. Declaring it earlier would have
# installed a command that fails only when run.
melete = "melete.cli:main"

[project.urls]
Homepage = "https://github.com/mnemosys-project/melete"
Issues = "https://github.com/mnemosys-project/melete/issues"

[dependency-groups]
# Exactly the tools vrg-validate invokes. The typecheck stage runs BOTH `ty`
# and mypy; the audit stage runs pip-audit and pip-licenses. Dropping any of
# them fails the pipeline with a FileNotFoundError rather than a useful
# message, so this list is a contract with vrg-validate, not a preference.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "ty>=0.0.1a1",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pip-licenses>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "S", "B", "A",
  "C4", "SIM", "TCH", "ARG", "PTH", "ERA",
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and may shadow builtins in fixtures.
"tests/**" = ["S101", "ARG001"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "integration: requires the Node/alphaTab toolchain (melete-render) or writes to disk (spec section 14)",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
