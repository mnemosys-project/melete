[project]
repository-type = "application"
versioning-scheme = "semver"
branching-model = "library-release"
release-model = "tagged-release"
primary-language = "python"

[ci]
versions = ["3.14"]
# The dedicated CI integration job stays off for now. See melete#23.
#
# This does not remove or skip any test. Spec section 14 specifies two tests
# that invoke the LilyPond binary - the render integration test and the CLI
# end-to-end smoke test. The render test already exists and, now that the
# container carries the binary, runs and passes in the ordinary pytest run;
# the smoke test is not written yet.
#
# What this flag governs is only CI's dedicated integration job: setting it
# true adds `test / integration / 3.14` to the branch ruleset's required
# checks. Both former preconditions for that are now met - the status-context
# is emitted (vergil-tooling#2720) and the container carries the binary
# (vergil-tooling#2718, via the [container].system-packages declaration
# below). Turning it on is nonetheless deferred to the integration-test
# follow-on that writes the remaining smoke test, so the job lands with the
# full suite it claims rather than half of one.
integration-tests = false

[container]
env-prefixes = []
system-packages = ["lilypond"]

[publish]
release = true
docs = false

[dependencies]
vergil = "v2.1"
