[project]
repository-type = "application"
versioning-scheme = "semver"
branching-model = "library-release"
release-model = "tagged-release"
primary-language = "python"

[ci]
versions = ["3.14"]
# Integration tests run; the dedicated CI integration job stays off.
#
# Spec section 14's two binary-dependent tests - the render integration test
# and the CLI end-to-end smoke test - both exist, are marked
# `@pytest.mark.integration`, and are never deselected, so they execute in
# the ordinary pytest run and are already covered in CI by
# `test / unit / 3.14`, against the LilyPond binary the container carries
# (see [container].system-packages below).
#
# Setting this true would add `test / integration / 3.14` to the branch
# ruleset's required checks, but the shared ci-test.yml@v2.1 emits only
# `unit`. Requiring a context no job emits blocks every PR while all checks
# are green - the unmergeable state melete#23 fixed by setting this false.
# The container precondition is met (vergil-tooling#2718) and #2720 added a
# parity guard that now fails loudly on the mismatch, but the emitting job
# is still owed by the open vergil-tooling#2721. Flip this only once that
# lands.
integration-tests = false

[container]
env-prefixes = []
system-packages = ["lilypond"]

[publish]
release = true
docs = false

[dependencies]
vergil = "v2.1"
